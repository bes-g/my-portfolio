<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(2,10,20,0.95),#050608 120%)}
    .login-card{width:100%;max-width:420px;background:rgba(15,18,24,0.96);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.3)}
    .login-card h1{margin:0 0 18px;color:#dff7ee}
    .login-card label{display:block;margin:12px 0 6px;color:var(--muted)}
    .login-card input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#eef0f5}
    .login-card button{margin-top:18px;width:100%;padding:12px 14px;border-radius:14px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#031018;font-weight:700;cursor:pointer}
    .login-feedback{margin-top:14px;color:var(--muted);min-height:24px}
    .login-footer{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Admin Login</h1>
      <form id="login-form">
        <label for="admin-password-input">Password</label>
        <input id="admin-password-input" type="password" placeholder="Enter admin password" required />
        <button type="submit">Continue</button>
      </form>
      <p id="login-feedback" class="login-feedback"></p>
    </div>
  </div>
  <script>
    const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;

    document.getElementById('login-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const password = document.getElementById('admin-password-input').value.trim();
      const feedback = document.getElementById('login-feedback');
      feedback.textContent = 'Checking password...';
      feedback.style.color = '#9aa0a6';

      try {
        const response = await fetch(`${apiBase}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error || 'Invalid password.');
        }

        window.location.href = 'admin.html';
      } catch (err) {
        feedback.textContent = err.message;
        feedback.style.color = 'salmon';
      }
    });
  </script>
</body>
</html>
